<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>تسجيل الدخول - معهد رعاية الضبعية</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                    e.preventDefault();
                }
            });
        })();
    </script>
</head>
<body>
    <header class="main-header">
        <img src="logo.png" alt="شعار معهد رعاية الضبعية" class="logo">
        <h1>تسجيل الدخول</h1>
    </header>

    <div class="main-container">
        <div class="login-form-container">
            <h2>أدخل بياناتك</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="off">
                </div>
                <div class="input-group" style="position: relative;">
                    <label for="password">كلمة المرور</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required style="padding-left: 40px;" autocomplete="off">
                        <i class="fas fa-eye" id="togglePassword" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">تسجيل الدخول</button>
            </form>
            
            <p style="text-align: center; margin-top: 15px;">
                ليس لديك حساب؟ <a href="signup.html" style="color: #1e40af; font-weight: bold;">إنشاء حساب</a>
            </p>
            <p style="text-align: center; margin-top: 15px;">
                ولي أمر؟ <a href="parent-login.html" style="color: #1e40af; font-weight: bold;">تسجيل دخول ولي الأمر</a>
            </p>
        </div>
    </div>

    <footer>
        <p>Developed by Ahmed Mousa <span class="heart">❤</span></p>
    </footer>

    <script src="auth.js" defer></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }
    </script>
</body>
</html>
