<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>نتيجة الصف الأول الثانوي تمريض</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);
      color: #1e293b;
      min-height: 100vh;
      padding: 20px 15px;
    }
    .header {
      text-align: center;
      padding: 20px 10px 25px;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      margin: auto;
      border: 4px solid #4a6cf7;
      box-shadow: 0 8px 20px rgba(74,108,247,0.25);
      background: white;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .header h1 {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: -0.3px;
    }
    .container {
      max-width: 720px;
      margin: auto;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      padding: 28px 25px;
      border-radius: 28px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      background: white;
      transition: 0.25s;
      font-family: 'Tajawal', sans-serif;
    }
    .search-box input:focus {
      outline: none;
      border-color: #4a6cf7;
      box-shadow: 0 0 0 4px rgba(74,108,247,0.15);
    }
    .search-box button {
      padding: 14px 30px;
      border: none;
      background: #4a6cf7;
      color: white;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 18px rgba(74,108,247,0.3);
    }
    .search-box button:hover {
      background: #3451d1;
      transform: translateY(-2px);
    }
    .subject {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 6px;
      border-bottom: 1px solid #f1f5f9;
    }
    .subject-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
    }
    .grade {
      font-weight: 700;
      font-size: 16px;
    }
    .good { color: #0d9488; }
    .avg { color: #d97706; }
    .bad { color: #b91c1c; }
    .student-card {
      background: #f8fafc;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .total {
      background: #eef2ff;
      padding: 14px;
      margin-top: 16px;
      border-radius: 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    .percent {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }
    .rank {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 700;
      color: #4a6cf7;
      text-align: center;
    }
    .no-result {
      text-align: center;
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 14px;
      display: none;
      margin-top: 16px;
      font-weight: 600;
    }
    .share-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
    }
    .share-btn:hover {
      background: #1da851;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }
    .hint {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
      text-align: center;
    }
  </style>
  <link rel="icon" type="image/png" href="/logo.png">
</head>
<body>
<div class="header">
  <div class="logo"><img src="logo.png" alt="شعار المدرسة"></div>
  <h1>نتيجة الصف الأول الثانوي تمريض</h1>
</div>

<div class="container">
  <div class="search-box">
    <input id="student-name" placeholder="🔍 الاسم (أي جزء منه)">
    <input id="seat-number" placeholder="🔢 رقم الجلوس (اختياري)">
    <button onclick="searchResult()"><i class="fas fa-search"></i> عرض النتيجة</button>
    <div class="hint">مثال: عبدالسلام أو عبد السلام، عبدالله أو عبد الله، ابراهيم أو إبراهيم</div>
  </div>

  <div id="result-container" style="display:none">
    <div class="student-card" id="student-info"></div>
    <div id="subjects-list"></div>
    <div class="total" id="total"></div>
    <div class="percent" id="percent"></div>
    <div class="rank" id="rank"></div>
    <button class="share-btn" id="share-btn" onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i> مشاركة على واتساب</button>
  </div>

  <p id="no-result" class="no-result">❌ لا توجد نتيجة مطابقة. تأكد من الاسم أو رقم الجلوس.</p>
</div>

<div class="footer">Developed by Ahmed Moussa ❤️</div>

<script>
  const results = [

    {seat:"526",name:"حمزه ادريس محمد قاسم",subjects:{"اللغة العربية":"17.5 / 20","اللغة الإنجليزية":"10 / 20","العلوم التطبيقية":"26 / 40","التشريح":"12.5 / 20","مبادئ التمريض":"6.5 / 12","الحاسب":"9.5 / 12","الدين":"14 / 16"}},
    {seat:"527",name:"زياد محمد خيري الراوي",subjects:{"اللغة العربية":"20 / 20","اللغة الإنجليزية":"11.5 / 20","العلوم التطبيقية":"27 / 40","التشريح":"14 / 20","مبادئ التمريض":"8.5 / 12","الحاسب":"9.5 / 12","الدين":"11 / 16"}},
    {seat:"528",name:"عبد الرحمن حسن احمد حسن",subjects:{"اللغة العربية":"18.5 / 20","اللغة الإنجليزية":"10 / 20","العلوم التطبيقية":"24 / 40","التشريح":"13.5 / 20","مبادئ التمريض":"5 / 12","الحاسب":"10 / 12","الدين":"13 / 16"}},
    {seat:"529",name:"عبد الله محمد جمعه حسين",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"10.5 / 20","العلوم التطبيقية":"35 / 40","التشريح":"17.5 / 20","مبادئ التمريض":"9 / 12","الحاسب":"10 / 12","الدين":"13 / 16"}},
    {seat:"530",name:"محمد احمد محمد ابوالمجد",subjects:{"اللغة العربية":"19 / 20","اللغة الإنجليزية":"8.5 / 20","العلوم التطبيقية":"30.5 / 40","التشريح":"16 / 20","مبادئ التمريض":"7.5 / 12","الحاسب":"10.5 / 12","الدين":"14.5 / 16"}},
    {seat:"531",name:"محمد احمد محمد احمد",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"17 / 20","العلوم التطبيقية":"35 / 40","التشريح":"18 / 20","مبادئ التمريض":"10.5 / 12","الحاسب":"11 / 12","الدين":"15 / 16"}},

    {seat:"533",name:"داليا عبدالسلام بدري محمد",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"15 / 20","العلوم التطبيقية":"34.5 / 40","التشريح":"12.5 / 20","مبادئ التمريض":"11.5 / 12","الحاسب":"11 / 12","الدين":"14.5 / 16"}},
    {seat:"534",name:"رضوى محمد فتحي عبد الحميد",subjects:{"اللغة العربية":"18.5 / 20","اللغة الإنجليزية":"9.5 / 20","العلوم التطبيقية":"27 / 40","التشريح":"12.5 / 20","مبادئ التمريض":"8 / 12","الحاسب":"11 / 12","الدين":"14.5 / 16"}},
    {seat:"535",name:"زمزم مصطفى فؤاد محمود",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"13.5 / 20","العلوم التطبيقية":"32 / 40","التشريح":"17 / 20","مبادئ التمريض":"9.5 / 12","الحاسب":"11.5 / 12","الدين":"14.5 / 16"}},
    {seat:"536",name:"زينب محمد عبد الدايم محمد",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"17 / 20","العلوم التطبيقية":"32.5 / 40","التشريح":"16 / 20","مبادئ التمريض":"11 / 12","الحاسب":"11.5 / 12","الدين":"11.5 / 16"}},
    {seat:"537",name:"سارة عامر عبد الراضي صديق",subjects:{"اللغة العربية":"18 / 20","اللغة الإنجليزية":"8 / 20","العلوم التطبيقية":"31 / 40","التشريح":"15.5 / 20","مبادئ التمريض":"7 / 12","الحاسب":"10.5 / 12","الدين":"11.5 / 16"}},
    {seat:"538",name:"شاهندا صابر سيد سعدي احمد",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"16.5 / 20","العلوم التطبيقية":"37.5 / 40","التشريح":"13 / 20","مبادئ التمريض":"8 / 12","الحاسب":"11 / 12","الدين":"14 / 16"}},
    {seat:"539",name:"فاطمه خيري عبدالله حسن",subjects:{"اللغة العربية":"20 / 20","اللغة الإنجليزية":"17 / 20","العلوم التطبيقية":"36 / 40","التشريح":"17 / 20","مبادئ التمريض":"11.5 / 12","الحاسب":"11 / 12","الدين":"15 / 16"}},
    {seat:"540",name:"ملك تيسير محمد الزاهر",subjects:{"اللغة العربية":"19.5 / 20","اللغة الإنجليزية":"16 / 20","العلوم التطبيقية":"32.5 / 40","التشريح":"15.5 / 20","مبادئ التمريض":"9.5 / 12","الحاسب":"11 / 12","الدين":"12 / 16"}},
    {seat:"541",name:"ملك محمد احمد محمد",subjects:{"اللغة العربية":"19 / 20","اللغة الإنجليزية":"15.5 / 20","العلوم التطبيقية":"34 / 40","التشريح":"17 / 20","مبادئ التمريض":"10.5 / 12","الحاسب":"10.5 / 12","الدين":"16 / 16"}},
    {seat:"542",name:"منه احمد عبد الفتاح احمد",subjects:{"اللغة العربية":"20 / 20","اللغة الإنجليزية":"18 / 20","العلوم التطبيقية":"34.5 / 40","التشريح":"16 / 20","مبادئ التمريض":"12 / 12","الحاسب":"10.5 / 12","الدين":"13 / 16"}},
    {seat:"543",name:"نوران احمد رشدي قناوي",subjects:{"اللغة العربية":"20 / 20","اللغة الإنجليزية":"8 / 20","العلوم التطبيقية":"32 / 40","التشريح":"13.5 / 20","مبادئ التمريض":"6.5 / 12","الحاسب":"11 / 12","الدين":"14 / 16"}},
    {seat:"544",name:"هاجر عبد النعيم رمضان بشاري",subjects:{"اللغة العربية":"20 / 20","اللغة الإنجليزية":"13.5 / 20","العلوم التطبيقية":"34.5 / 40","التشريح":"15.5 / 20","مبادئ التمريض":"6 / 12","الحاسب":"11.5 / 12","الدين":"15 / 16"}}
  ];

  const icons = {
    "اللغة العربية":"📖",
    "اللغة الإنجليزية":"📝",
    "العلوم التطبيقية":"🔬",
    "التشريح":"🧠",
    "مبادئ التمريض":"💉",
    "الحاسب":"💻",
    "الدين":"🕌"
  };

  // دالة تطبيع النص للبحث المرن (تتعامل مع عبدالسلام/عبد السلام، أ/إ/ا، ة/ه)
  function normalizeArabic(str) {
    if (!str) return '';
    return str
      .replace(/[أإآا]/g, 'ا')       // توحيد الألفات
      .replace(/ة/g, 'ه')            // التاء المربوطة إلى هاء
      .replace(/ى/g, 'ي')            // الألف المقصورة إلى ياء
      .replace(/\s+/g, ' ')          // إزالة المسافات الزائدة
      .replace(/(عبد)\s+(ال|اله)/g, '$1$2') // عبد السلام -> عبدالسلام
      .replace(/(عبد)\s+(الله)/g, '$1$2')   // عبد الله -> عبدالله
      .trim()
      .toLowerCase();
  }

  function gradeColor(p) {
    if (p >= 85) return "good";
    if (p >= 60) return "avg";
    return "bad";
  }

  function searchResult() {
    const rawName = document.getElementById("student-name").value.trim();
    const rawSeat = document.getElementById("seat-number").value.trim();
    
    const normalizedInputName = normalizeArabic(rawName);
    const normalizedSeat = rawSeat.trim();
    
    const list = document.getElementById("subjects-list");
    list.innerHTML = "";
    
    // إذا كان كلا الحقلين فارغين
    if (!normalizedInputName && !normalizedSeat) {
      document.getElementById("no-result").style.display = "block";
      document.getElementById("result-container").style.display = "none";
      return;
    }

    // البحث باستخدام المرونة الكاملة
    const student = results.find(s => {
      const normalizedStudentName = normalizeArabic(s.name);
      
      // مطابقة رقم الجلوس (إذا تم إدخاله)
      const seatMatch = normalizedSeat ? (s.seat === normalizedSeat) : true;
      
      // مطابقة الاسم (إذا تم إدخاله) - أي جزء من الاسم بعد التطبيع
      let nameMatch = true;
      if (normalizedInputName) {
        // البحث إذا كان النص المدخل موجوداً كجزء من الاسم المطبع
        nameMatch = normalizedStudentName.includes(normalizedInputName);
      }
      
      return seatMatch && nameMatch;
    });

    if (!student) {
      document.getElementById("no-result").style.display = "block";
      document.getElementById("result-container").style.display = "none";
      return;
    }

    document.getElementById("no-result").style.display = "none";
    
    // عرض بيانات الطالب
    document.getElementById("student-info").innerHTML = `
      <h2 style="margin-bottom:6px;">${student.name}</h2>
      <div style="font-weight:600; color:#334155;">رقم الجلوس: ${student.seat}</div>
    `;

    let total = 0, max = 0;
    for (const sub in student.subjects) {
      const g = student.subjects[sub];
      const [a, b] = g.split('/').map(x => parseFloat(x));
      const p = (a / b) * 100;
      total += a;
      max += b;
      list.innerHTML += `
        <div class="subject">
          <div class="subject-name">${icons[sub] || '📌'} ${sub}</div>
          <div class="grade ${gradeColor(p)}">${a} / ${b}</div>
        </div>
      `;
    }

    const percent = (total / max * 100).toFixed(1);
    document.getElementById("total").innerHTML = `<span>المجموع الكلي</span> <span>${total} / ${max}</span>`;
    document.getElementById("percent").innerHTML = `النسبة المئوية: ${percent}%`;
    
    // حساب الترتيب
    const sorted = results.map(s => {
      let sum = 0, maxSum = 0;
      for (const sub in s.subjects) {
        const [a, b] = s.subjects[sub].split('/').map(x => parseFloat(x));
        sum += a;
        maxSum += b;
      }
      return { name: s.name, percent: (sum / maxSum * 100).toFixed(1) };
    }).sort((a, b) => b.percent - a.percent);
    
    const rankIndex = sorted.findIndex(s => s.name === student.name) + 1;
    document.getElementById("rank").innerHTML = `🏅 ترتيب الطالب على الدفعة: ${rankIndex} / ${results.length}`;
    
    document.getElementById("result-container").style.display = "block";
  }

  function shareWhatsApp() {
    const rawName = document.getElementById("student-name").value.trim();
    const rawSeat = document.getElementById("seat-number").value.trim();
    const normalizedInputName = normalizeArabic(rawName);
    
    const student = results.find(s => {
      const normalizedStudentName = normalizeArabic(s.name);
      const seatMatch = rawSeat ? (s.seat === rawSeat.trim()) : true;
      const nameMatch = normalizedInputName ? normalizedStudentName.includes(normalizedInputName) : true;
      return seatMatch && nameMatch;
    });
    
    if (!student) return;
    
    let msg = `نتيجة الطالب ${student.name} (رقم الجلوس ${student.seat}):%0A`;
    let total = 0, max = 0;
    for (const sub in student.subjects) {
      const g = student.subjects[sub];
      const [a, b] = g.split('/').map(x => parseFloat(x));
      msg += `${icons[sub] || ''} ${sub}: ${a} / ${b}%0A`;
      total += a;
      max += b;
    }
    const percent = (total / max * 100).toFixed(1);
    msg += `المجموع: ${total} / ${max}%0Aالنسبة: ${percent}%`;
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  }

  // البحث عند الضغط على Enter
  document.getElementById("student-name").addEventListener("keypress", (e) => {
    if (e.key === "Enter") searchResult();
  });
  document.getElementById("seat-number").addEventListener("keypress", (e) => {
    if (e.key === "Enter") searchResult();
  });
</script>
</body>
</html>
