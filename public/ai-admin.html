<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الذكاء الاصطناعي</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <style>
        .ai-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #d4af37;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f8f9fa;
            border-color: #1a2526;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-trained {
            background: #28a745;
            color: white;
        }
        .status-untrained {
            background: #dc3545;
            color: white;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d4af37;
            transition: width 0.3s;
        }
    </style>
    <link rel="icon" type="image/png" href="/logo.png">
</head>
<body>
    <header class="main-header">
        <img src="logo.png" alt="شعار المعهد" class="logo">
        <h1>🧠 لوحة تحكم الذكاء الاصطناعي</h1>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </header>

    <div class="admin-container">
        <div class="ai-card">
            <h2><i class="fas fa-info-circle"></i> حالة الذكاء الاصطناعي</h2>
            <div id="aiStatus">
                <p>جاري تحميل المعلومات...</p>
            </div>
        </div>

        <div class="ai-card">
            <h2><i class="fas fa-upload"></i> تدريب الذكاء الاصطناعي</h2>
            <p>ارفع ملفات (PDF، Word، Excel، TXT) لتدريب الذكاء الاصطناعي عليها</p>
            
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #d4af37;"></i>
                <p>اضغط هنا لاختيار ملف أو اسحب الملف إلى هنا</p>
                <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.xls,.txt" style="display: none;" multiple>
            </div>
            
            <div id="uploadProgress" class="progress-bar" style="display: none;">
                <div class="progress-fill"></div>
            </div>
            
            <div id="uploadResults" class="file-list"></div>
        </div>

        <div class="ai-card">
            <h2><i class="fas fa-trash-alt"></i> تنظيف البيانات</h2>
            <button class="submit-btn" onclick="clearTraining()" style="background: #dc3545; color: white;">
                <i class="fas fa-trash"></i> حذف جميع بيانات التدريب
            </button>
        </div>
    </div>

    <script>
        async function loadAIStatus() {
            try {
                const response = await fetch('/api/ai/status');
                const data = await response.json();
                const statusDiv = document.getElementById('aiStatus');
                
                if (data.trained) {
                    statusDiv.innerHTML = `
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <div class="stat-box"><div class="stat-number">${data.fileCount}</div><div class="stat-label">الملفات المدربة</div></div>
                            <div class="stat-box"><div class="stat-number">${data.chunksCount}</div><div class="stat-label">الأجزاء المستخرجة</div></div>
                            <div class="stat-box"><div class="stat-number"><span class="status-badge status-trained">مدرب ✅</span></div><div class="stat-label">الحالة</div></div>
                        </div>
                        <p style="margin-top: 15px;"><small>آخر تحديث: ${data.lastUpdate ? new Date(data.lastUpdate).toLocaleString('ar-EG') : 'غير معروف'}</small></p>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div style="text-align: center; padding: 20px;">
                            <span class="status-badge status-untrained">لم يتم التدريب بعد ❌</span>
                            <p>قم برفع ملفات لبدء تدريب الذكاء الاصطناعي</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading AI status:', error);
            }
        }

        async function uploadFiles(files) {
            const resultsDiv = document.getElementById('uploadResults');
            const progressBar = document.getElementById('uploadProgress');
            const progressFill = document.querySelector('.progress-fill');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                
                progressBar.style.display = 'block';
                progressFill.style.width = `${((i + 1) / files.length) * 100}%`;
                
                try {
                    const response = await fetch('/api/ai/train', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    if (result.success) {
                        fileDiv.innerHTML = `
                            <span><i class="fas fa-file"></i> ${file.name}</span>
                            <span style="color: #28a745;">✅ تم التدريب (${result.chunksCount} جزء)</span>
                        `;
                    } else {
                        fileDiv.innerHTML = `
                            <span><i class="fas fa-file"></i> ${file.name}</span>
                            <span style="color: #dc3545;">❌ فشل: ${result.error}</span>
                        `;
                    }
                    resultsDiv.appendChild(fileDiv);
                    
                } catch (error) {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    fileDiv.innerHTML = `
                        <span><i class="fas fa-file"></i> ${file.name}</span>
                        <span style="color: #dc3545;">❌ خطأ في الاتصال</span>
                    `;
                    resultsDiv.appendChild(fileDiv);
                }
            }
            
            progressBar.style.display = 'none';
            loadAIStatus();
            showToast('تم الانتهاء من معالجة الملفات', 'success');
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            uploadFiles(files);
            document.getElementById('uploadResults').innerHTML = '';
        });

        // سحب وإفلات الملفات
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#e8f5e9';
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            uploadArea.style.background = 'transparent';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'transparent';
            const files = Array.from(e.dataTransfer.files);
            uploadFiles(files);
            document.getElementById('uploadResults').innerHTML = '';
        });

        async function clearTraining() {
            if (!confirm('⚠️ تحذير: هذا سيحذف جميع بيانات تدريب الذكاء الاصطناعي. هل أنت متأكد؟')) return;
            
            try {
                const response = await fetch('/api/ai/clear', { method: 'DELETE' });
                if (response.ok) {
                    showToast('تم حذف جميع بيانات التدريب', 'success');
                    loadAIStatus();
                    document.getElementById('uploadResults').innerHTML = '';
                }
            } catch (error) {
                showToast('خطأ في حذف البيانات', 'error');
            }
        }

        function showToast(message, type) {
            const bg = type === 'success' ? '#28a745' : '#dc3545';
            Toastify({ text: message, duration: 3000, gravity: 'top', position: 'right', backgroundColor: bg }).showToast();
        }

        window.logout = function() {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
        };

        loadAIStatus();
    </script>
</body>
</html>
